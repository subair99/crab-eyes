services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crab
      POSTGRES_PASSWORD: crab
      POSTGRES_DB: crabeyes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crab:crab@db:5432/crabeyes
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
